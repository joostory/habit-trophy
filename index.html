<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="30일 동안의 매일 도전을 기록하고 등급별 습관 트로피를 모아보세요!">
    <title>HabitTrophy - 30일 습관 도전</title>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://joostory.github.io/habit-trophy/">
    <meta property="og:title" content="HabitTrophy - 30일 습관 도전">
    <meta property="og:description" content="30일 동안의 매일 도전을 기록하고 나만의 등급별 습관 트로피를 모아보세요!">
    <meta property="og:image" content="https://joostory.github.io/habit-trophy/og-image.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://joostory.github.io/habit-trophy/">
    <meta property="twitter:title" content="HabitTrophy - 30일 습관 도전">
    <meta property="twitter:description" content="30일 동안의 매일 도전을 기록하고 나만의 등급별 습관 트로피를 모아보세요!">
    <meta property="twitter:image" content="https://joostory.github.io/habit-trophy/og-image.svg">
    
    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0e15">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HabitTrophy">
    
    <!-- Favicon (Fallback) & Apple Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230f111a%22 rx=%2220%22/><text y=%2254%22 x=%2250%22 font-size=%2255%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22>🏆</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230f111a%22 rx=%2220%22/><text y=%2254%22 x=%2250%22 font-size=%2255%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22>🏆</text></svg>">
    
    <!-- Google Fonts: Outfit (Header, Trophy) & Inter (Body UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons (Modern Light-weight icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Animated Aurora Lights -->
    <div class="aurora-bg">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
    </div>

    <!-- App Container -->
    <div class="app-container">
        <!-- Header Panel -->
        <header class="app-header">
            <div class="header-logo">
                <span class="logo-emoji">🏆</span>
                <h1>HabitTrophy</h1>
            </div>
            <div class="header-actions">
                <button id="noti-permission-btn" class="icon-btn" title="알림 권한 설정">
                    <i data-lucide="bell"></i>
                </button>
            </div>
        </header>

        <!-- Main Content (SPA Screens) -->
        <main class="app-main">
            <!-- Screen 1: Dashboard (Home) -->
            <section id="screen-dashboard" class="app-screen active">
                <div class="screen-header">
                    <h2>진행 중인 도전</h2>
                    <span class="challenge-count" id="active-count">0개</span>
                </div>
                
                <!-- Active Challenges Grid -->
                <div class="challenges-list" id="challenges-container">
                    <!-- Empty State -->
                    <div class="empty-state" id="dashboard-empty">
                        <div class="empty-icon">🌱</div>
                        <h3>새로운 도전을 시작해 보세요!</h3>
                        <p>30일 뒤에는 반짝이는 나만의 습관 트로피로 탄생합니다.</p>
                        <button class="btn btn-primary" onclick="app.showCreateModal()">
                            <i data-lucide="plus"></i>첫 도전 시작하기
                        </button>
                    </div>
                </div>
            </section>

            <!-- Screen 2: Challenge Detail -->
            <section id="screen-detail" class="app-screen">
                <div class="detail-header-nav">
                    <button class="icon-btn-back" onclick="app.navigateTo('dashboard')">
                        <i data-lucide="arrow-left"></i> 대시보드
                    </button>
                    <button class="btn-delete-challenge" id="btn-delete-challenge">
                        <i data-lucide="trash-2"></i> 삭제
                    </button>
                </div>

                <div class="challenge-detail-card glass-panel" id="detail-card-info">
                    <!-- Dynamic details go here -->
                </div>

                <!-- 30-Day Grid Section -->
                <div class="grid-section">
                    <div class="grid-section-header">
                        <h3>30일 달성 달력</h3>
                        <span class="days-remaining" id="detail-days-remaining">30일 남음</span>
                    </div>
                    
                    <div class="days-grid-container" id="days-grid">
                        <!-- 30 days grid dynamic elements -->
                    </div>
                </div>
                
                <!-- Daily Memo Sheet / Detail Logs -->
                <div class="memo-logs-section glass-panel">
                    <h3>오늘의 실천 일기</h3>
                    <div class="memo-input-container" id="memo-input-block">
                        <textarea id="today-memo-input" placeholder="오늘 실천하면서 어땠나요? 가벼운 다짐이나 소감을 한 줄 남겨주세요." maxlength="100"></textarea>
                        <div class="memo-actions">
                            <span class="char-counter" id="char-counter">0/100</span>
                            <button class="btn btn-accent btn-sm" id="btn-save-memo">기록 저장</button>
                        </div>
                    </div>
                    
                    <div class="memo-history-timeline" id="memo-history-list">
                        <!-- Memos timeline goes here -->
                    </div>
                </div>
            </section>

            <!-- Screen 3: Trophy Room -->
            <section id="screen-trophies" class="app-screen">
                <div class="screen-header">
                    <h2>트로피 보관함</h2>
                    <span class="trophy-count" id="trophy-count">0개</span>
                </div>
                
                <!-- 3D Style Shelf for Trophies -->
                <div class="trophy-room-shelf">
                    <div class="trophy-grid" id="trophy-container">
                        <!-- Empty State -->
                        <div class="empty-state" id="trophies-empty">
                            <div class="empty-icon">🔒</div>
                            <h3>습관 트로피가 아직 비어있습니다.</h3>
                            <p>30일 도전을 성공적으로 마치면 여기에 등급별 트로피가 전시됩니다!</p>
                        </div>
                    </div>
                    <div class="shelf-wood"></div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="app-nav">
            <button class="nav-item active" id="nav-dashboard" onclick="app.navigateTo('dashboard')">
                <i data-lucide="compass"></i>
                <span>도전</span>
            </button>
            <button class="nav-item" id="nav-create" onclick="app.showCreateModal()">
                <div class="nav-fab">
                    <i data-lucide="plus"></i>
                </div>
            </button>
            <button class="nav-item" id="nav-trophies" onclick="app.navigateTo('trophies')">
                <i data-lucide="award"></i>
                <span>트로피 룸</span>
            </button>
        </nav>
    </div>

    <!-- Create/Edit Challenge Overlay Modal -->
    <div class="modal-overlay" id="modal-create-challenge">
        <div class="modal-content glass-panel animated-scale-up">
            <header class="modal-header">
                <h3 id="modal-title">새로운 도전 설계하기</h3>
                <button class="icon-btn-close" onclick="app.hideCreateModal()">
                    <i data-lucide="x"></i>
                </button>
            </header>
            
            <form id="challenge-form" onsubmit="event.preventDefault(); app.saveChallenge();">
                <input type="hidden" id="challenge-id">
                
                <!-- Challenge Name -->
                <div class="form-group">
                    <label for="input-habit-name">어떤 습관을 만들고 싶으신가요?</label>
                    <input type="text" id="input-habit-name" required placeholder="예: 매일 아침 10분 스트레칭, 하루 1.5L 물 마시기" maxlength="25">
                </div>

                <!-- One Line Resolution -->
                <div class="form-group">
                    <label for="input-habit-resolution">도전을 시작하는 나의 다짐 한 줄</label>
                    <input type="text" id="input-habit-resolution" placeholder="예: 무너지지 않는 건강한 몸을 위해!" maxlength="40">
                </div>

                <!-- Daily Reminder Alarm -->
                <div class="form-group inline-group">
                    <div>
                        <label for="input-alarm-time">매일 몇 시에 실천을 알릴까요?</label>
                        <p class="form-help">지정한 시간이 되면 브라우저로 잊지 않게 푸시 알림을 드립니다.</p>
                    </div>
                    <input type="time" id="input-alarm-time" value="20:00">
                </div>

                <!-- Theme Color Selection -->
                <div class="form-group">
                    <label>도전 카드 테마 컬러</label>
                    <div class="color-picker-palette">
                        <label class="color-option color-blue">
                            <input type="radio" name="theme-color" value="var(--neon-blue)" checked>
                            <span class="color-swatch" style="background: var(--neon-blue)"></span>
                        </label>
                        <label class="color-option color-purple">
                            <input type="radio" name="theme-color" value="var(--neon-purple)">
                            <span class="color-swatch" style="background: var(--neon-purple)"></span>
                        </label>
                        <label class="color-option color-pink">
                            <input type="radio" name="theme-color" value="var(--neon-pink)">
                            <span class="color-swatch" style="background: var(--neon-pink)"></span>
                        </label>
                        <label class="color-option color-emerald">
                            <input type="radio" name="theme-color" value="var(--neon-emerald)">
                            <span class="color-swatch" style="background: var(--neon-emerald)"></span>
                        </label>
                        <label class="color-option color-orange">
                            <input type="radio" name="theme-color" value="var(--neon-orange)">
                            <span class="color-swatch" style="background: var(--neon-orange)"></span>
                        </label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="app.hideCreateModal()">취소</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-challenge">도전 시작하기! 🚀</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Trophy Detail Overlay Modal -->
    <div class="modal-overlay" id="modal-trophy-detail">
        <div class="modal-content glass-panel animated-scale-up trophy-modal">
            <header class="modal-header">
                <h3>🏆 습관 트로피 기록장</h3>
                <button class="icon-btn-close" onclick="app.hideTrophyModal()">
                    <i data-lucide="x"></i>
                </button>
            </header>
            
            <div class="trophy-detail-body" id="trophy-detail-content">
                <!-- Dynamic Trophy info & Memo histories -->
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-primary btn-block" id="btn-rechallenge-trophy">이 습관으로 다시 도전하기! 🔄</button>
            </div>
        </div>
    </div>

    <!-- Fast-Forward Tester Overlay (개발 및 검증용) -->
    <div class="fast-forward-tester" id="ff-tester-block">
        <div class="tester-label">🧪 테스트 도구</div>
        <button onclick="app.fastForwardChallenge(29)" class="btn btn-sm btn-accent">29일 완료 (승격 대기)</button>
        <button onclick="app.fastForwardChallenge(23)" class="btn btn-sm btn-secondary">23일 완료 (실버 대기)</button>
    </div>

    <!-- Core App JS -->
    <script src="app.js"></script>
</body>
</html>
