name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # main 브랜치에 코드가 push될 때 트리거됩니다.

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시성(concurrency) 제어로 중복 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
      
      # 2. GitHub Pages 배포 환경 구성
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      # 3. 정적 웹 자산을 Artifact로 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # 루트 디렉토리의 HTML, CSS, JS, JSON을 그대로 타겟팅합니다.
          
      # 4. GitHub Pages에 정식 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
